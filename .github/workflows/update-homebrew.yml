name: Update Homebrew Formula

on:
  release:
    types: [published]

# Prevent concurrent runs to avoid race conditions on formula updates
concurrency:
  group: homebrew-formula-update
  cancel-in-progress: false

# Explicit minimal permissions - only what's needed
permissions:
  contents: read

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    # Use a protected environment for release operations
    environment: release
    steps:
      - name: Checkout homebrew tap
        # Pinned to full SHA for supply-chain security (v4.4.0)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AmJaradat01/homebrew-awesome-lazy-zsh
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          
          TARBALL_URL="https://github.com/AmJaradat01/awesome-lazy-zsh/archive/refs/tags/${TAG}.tar.gz"
          
          # Download with -f to fail on HTTP errors (4xx, 5xx)
          # Use temp file to avoid hashing error pages
          TEMP_FILE=$(mktemp)
          if ! curl -fsSL "$TARBALL_URL" -o "$TEMP_FILE"; then
            echo "::error::Failed to download tarball from $TARBALL_URL"
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          SHA256=$(shasum -a 256 "$TEMP_FILE" | cut -d ' ' -f 1)
          rm -f "$TEMP_FILE"
          
          # Validate SHA256 is exactly 64 hex characters
          if ! echo "$SHA256" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::Invalid SHA256 format: $SHA256"
            exit 1
          fi
          
          cd homebrew-tap/Formula
          
          # Update formula with validated values
          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" awesome-lazy-zsh.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" awesome-lazy-zsh.rb
          
          echo "Updated formula to ${TAG} with SHA256: ${SHA256}"
          cat awesome-lazy-zsh.rb

      - name: Validate formula syntax
        run: ruby -c homebrew-tap/Formula/awesome-lazy-zsh.rb

      - name: Commit, push automation branch, and open PR
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/awesome-lazy-zsh.rb
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: bump formula to ${TAG}"
          branch="automation/formula-${TAG}"
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"
          gh pr create --repo AmJaradat01/homebrew-awesome-lazy-zsh --base main --head "$branch" \
            --title "chore: bump formula to ${TAG}" \
            --body "Updates the formula to the signed ${TAG} release. Merge only after tap CI and formula tests pass." \
            || gh pr view "$branch" --repo AmJaradat01/homebrew-awesome-lazy-zsh
