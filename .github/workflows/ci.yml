name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['18', '20', '22']

    steps:
      # Pinned to full SHA for supply-chain security (v4.4.0)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Pinned to full SHA for supply-chain security (v4.4.0)
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Retry up to 3 times due to intermittent Node.js test runner deserialization issues
        run: |
          for i in 1 2 3; do
            echo "Test attempt $i..."
            if npm test; then
              echo "Tests passed on attempt $i"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Tests failed, retrying..."
              sleep 2
            fi
          done
          echo "Tests failed after 3 attempts"
          exit 1
        env:
          # Use isolated test directory to avoid writing to real home
          HOME: ${{ runner.temp }}/test-home
          AWESOME_LAZY_ZSH_TEST_MODE: "1"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          # Validate all JS files parse correctly
          find src -name "*.js" -exec node --check {} \;

      - name: Check shell scripts
        run: |
          # Install shellcheck
          sudo apt-get update && sudo apt-get install -y shellcheck
          
          # Lint shell scripts
          shellcheck setup.sh || true
          shellcheck src/*.zsh || true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
